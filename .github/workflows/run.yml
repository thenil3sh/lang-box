name: update gist

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci
      - run: npm start
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID || 'c42954bf442a41bf7719c3270da9896e' }}
          USERNAME: ${{ github.actor }}
          MODE: "all"
          LANGUAGES: "Rust,Java,Kotlin,Python"
          GIST_TITLE: "💻 Coding languages"
