name: update gist

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential cmake pkg-config libgit2-dev libicu-dev zlib1g-dev libcurl4-openssl-dev libssl-dev ruby-dev

      - name: Install GitHub Linguist
        run: |
          gem install rugged -v 1.7.2 -- --use-system-libraries
          gem install github-linguist -v 9.7.0
          github-linguist --version

      - run: npm ci
      - run: npm start
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID || 'c42954bf442a41bf7719c3270da9896e' }}
          USERNAME: ${{ github.actor }}
