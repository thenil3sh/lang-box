name: update gist

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci
      - run: npm start
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          USERNAME: ${{ vars.GH_USERNAME || github.actor }}
          MODE: ${{ vars.MODE || 'all' }}
          LANGUAGES: ${{ vars.LANGUAGES }}
          MAX_LANGUAGES: ${{ vars.MAX_LANGUAGES || '8' }}
          EXCLUDE_LANGUAGES: ${{ vars.EXCLUDE_LANGUAGES }}
          EXCLUDE_REPOS: ${{ vars.EXCLUDE_REPOS }}
          GIST_TITLE: ${{ vars.GIST_TITLE || 'languages' }}
